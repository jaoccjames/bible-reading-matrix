<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>每日讀經方陣｜聖經經卷查詢</title>

  <style>
    :root{
      --primary:#2f8fd8;      /* 主藍 */
      --primary-2:#1f6fb2;    /* 深藍 */
      --bg:#eef2f6;           /* 淺灰背景 */
      --card:#ffffff;         /* 白卡 */
      --text:#1f2937;
      --muted:#6b7280;
      --border:#d9e2ec;
      --shadow: 0 10px 26px rgba(16,24,40,.10);
      --radius: 14px;

      --ok:#2e7d32;
      --todo:#b26a00;
      --danger:#b00020;
    }

    *{box-sizing:border-box;}

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
        "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap{
      max-width: 1040px;
      margin: 36px auto 56px;
      padding: 0 18px;
    }

    /* 主白卡 */
    .card{
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 26px 26px 22px;
    }

    header{
      text-align:center;
      margin-bottom: 18px;
    }

    h1{
      margin: 6px 0 4px;
      font-size: 30px;
      letter-spacing: .6px;
      font-weight: 850;
    }

    .sub{
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.6;
    }

    .topline{
      height: 3px;
      width: 100%;
      background: var(--primary);
      border-radius: 999px;
      margin: 16px 0 18px;
    }

    .pillrow{
      margin-top: 10px;
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:8px;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      border:1px solid var(--border);
      background:#f8fafc;
      padding:6px 10px;
      border-radius:999px;
      color:var(--muted);
      font-size:12px;
      font-weight:600;
    }

    a{color: var(--primary-2); text-decoration:none;}
    a:hover{text-decoration:underline;}

    /* Accordion */
    details{
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      margin: 14px 0;
      overflow: hidden;
    }
    details[open]{
      border: 2px solid var(--primary);
    }
    summary{
      list-style:none;
      cursor:pointer;
      padding: 16px 16px;
      font-weight: 850;
      color: var(--primary-2);
      display:flex;
      align-items:center;
      gap:10px;
      user-select: none;
    }
    summary::-webkit-details-marker{ display:none; }

    .section-body{
      padding: 0 16px 16px;
    }

    /* 搜尋面板（放在 Accordion 裡） */
    .panel{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      padding: 2px 0 0;
    }

    input, select{
      background:#fff;
      color: var(--text);
      border:1px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 14px;
      outline:none;
      font-weight: 600;
    }
    input::placeholder{color:#94a3b8; font-weight:600;}
    input:focus, select:focus{
      border-color: rgba(47,143,216,.65);
      box-shadow: 0 0 0 4px rgba(47,143,216,.18);
    }

    .smallbtn{
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      color: var(--primary-2);
    }
    .smallbtn:hover{
      background: rgba(47,143,216,.08);
      border-color: rgba(47,143,216,.45);
    }

    .stat{
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .err{
      margin-top: 12px;
      color: var(--danger);
      font-size: 13px;
      display:none;
      font-weight: 700;
      padding: 12px 12px;
      border-radius: 12px;
      background: rgba(176,0,32,.06);
      border: 1px solid rgba(176,0,32,.18);
    }

    /* 表格：藍色表頭 */
    table{
      width:100%;
      border-collapse: collapse;
      margin-top: 14px;
      background:#fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow:hidden;
    }

    thead th{
      text-align:left;
      font-size: 12px;
      color:#fff;
      padding: 12px 12px;
      background: var(--primary);
      position: sticky;
      top: 0;
      font-weight: 850;
      letter-spacing: .2px;
    }

    tbody td{
      padding: 12px 12px;
      border-top: 1px solid var(--border);
      font-size: 14px;
      vertical-align: top;
      line-height: 1.65;
    }

    tbody tr:hover{background: #f8fafc;}

    .muted{
      color:#64748b;
      font-size: 12px;
      word-break: break-all;
      margin-top: 6px;
      font-weight: 650;
    }

    .badge{
      display:inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid var(--border);
      background:#f8fafc;
      font-weight: 850;
    }
    .badge.ok{ color: var(--ok); }
    .badge.todo{ color: var(--todo); }

    .footer{
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      text-align:center;
      font-weight: 650;
    }

    code{
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-weight: 800;
    }

    @media (max-width: 720px){
      .card{ padding: 18px 16px 16px; }
      h1{ font-size: 24px; }
    }

    @media (max-width: 640px){
      thead{display:none;}
      table,tbody,tr,td{display:block;width:100%;}
      tbody td{border-top:none;}
      tbody tr{border-top:1px solid var(--border);}
      tbody td::before{
        content:attr(data-label);
        display:block;
        color:#64748b;
        font-size:12px;
        margin-bottom: 4px;
        font-weight: 800;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">

      <header>
        <h1>每日讀經方陣｜聖經經卷查詢</h1>
        <div class="sub">支援交集搜尋（空格＝AND），並可直接開啟對應的 Claude Artifacts（資料來源：GitHub CSV）</div>

        <div class="pillrow">
          <span class="pill" id="buildInfo">Build: <span id="buildTime">--</span></span>
          <span class="pill">CSV:
            <a href="https://raw.githubusercontent.com/jaoccjames/bible-reading-matrix/refs/heads/main/data/bible_index.csv"
               target="_blank" rel="noopener noreferrer">raw</a>
          </span>
        </div>

        <div class="topline"></div>
      </header>

      <!-- Accordion: 搜尋/篩選 -->
      <details open>
        <summary>▼ 搜尋與篩選</summary>
        <div class="section-body">
          <div class="panel">
            <input id="q" style="flex:1;min-width:240px;"
              placeholder="🔎 搜尋：如『太 1』、『創 15』、『創世記第15章』、URL 末段…（空格＝交集）" />

            <select id="hasUrl">
              <option value="all">全部（含未建立）</option>
              <option value="yes">只顯示有連結</option>
              <option value="no">只顯示未建立</option>
            </select>

            <select id="scope">
              <option value="all">全部</option>
              <option value="OT">舊約</option>
              <option value="NT">新約</option>
            </select>

            <select id="book">
              <option value="">全部書卷</option>
            </select>

            <button class="smallbtn" id="clear">清除</button>
            <div class="stat" id="stat"></div>
          </div>

          <div class="err" id="err"></div>

          <table>
            <thead>
              <tr>
                <th style="width:180px;">卷</th>
                <th style="width:70px;">章</th>
                <th>Artifacts（V1）</th>
                <th style="width:90px;">狀態</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>

          <div class="footer">
            提示：搜尋中的「數字」會以「整章」比對，避免 <code>1</code> 誤中 <code>10</code>、<code>11</code>。
          </div>
        </div>
      </details>

    </div>
  </div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/jaoccjames/bible-reading-matrix/refs/heads/main/data/bible_index.csv";

// 聖經標準順序（同時附上新舊約分類）
const ORDER = [
  // 舊約
  {b:'創世記',t:'OT'},{b:'出埃及記',t:'OT'},{b:'利未記',t:'OT'},{b:'民數記',t:'OT'},{b:'申命記',t:'OT'},
  {b:'約書亞記',t:'OT'},{b:'士師記',t:'OT'},{b:'路得記',t:'OT'},
  {b:'撒母耳記上',t:'OT'},{b:'撒母耳記下',t:'OT'},{b:'列王紀上',t:'OT'},{b:'列王紀下',t:'OT'},
  {b:'歷代志上',t:'OT'},{b:'歷代志下',t:'OT'},{b:'以斯拉記',t:'OT'},{b:'尼希米記',t:'OT'},{b:'以斯帖記',t:'OT'},
  {b:'約伯記',t:'OT'},{b:'詩篇',t:'OT'},{b:'箴言',t:'OT'},{b:'傳道書',t:'OT'},{b:'雅歌',t:'OT'},
  {b:'以賽亞書',t:'OT'},{b:'耶利米書',t:'OT'},{b:'耶利米哀歌',t:'OT'},{b:'以西結書',t:'OT'},{b:'但以理書',t:'OT'},
  {b:'何西阿書',t:'OT'},{b:'約珥書',t:'OT'},{b:'阿摩司書',t:'OT'},{b:'俄巴底亞書',t:'OT'},{b:'約拿書',t:'OT'},
  {b:'彌迦書',t:'OT'},{b:'那鴻書',t:'OT'},{b:'哈巴谷書',t:'OT'},{b:'西番雅書',t:'OT'},{b:'哈該書',t:'OT'},{b:'撒迦利亞書',t:'OT'},{b:'瑪拉基書',t:'OT'},
  // 新約
  {b:'馬太福音',t:'NT'},{b:'馬可福音',t:'NT'},{b:'路加福音',t:'NT'},{b:'約翰福音',t:'NT'},
  {b:'使徒行傳',t:'NT'},{b:'羅馬書',t:'NT'},{b:'哥林多前書',t:'NT'},{b:'哥林多後書',t:'NT'},
  {b:'加拉太書',t:'NT'},{b:'以弗所書',t:'NT'},{b:'腓立比書',t:'NT'},{b:'歌羅西書',t:'NT'},
  {b:'帖撒羅尼迦前書',t:'NT'},{b:'帖撒羅尼迦後書',t:'NT'},{b:'提摩太前書',t:'NT'},{b:'提摩太後書',t:'NT'},
  {b:'提多書',t:'NT'},{b:'腓利門書',t:'NT'},{b:'希伯來書',t:'NT'},{b:'雅各書',t:'NT'},
  {b:'彼得前書',t:'NT'},{b:'彼得後書',t:'NT'},{b:'約翰一書',t:'NT'},{b:'約翰二書',t:'NT'},{b:'約翰三書',t:'NT'},
  {b:'猶大書',t:'NT'},{b:'啟示錄',t:'NT'}
];

const orderMap = Object.fromEntries(ORDER.map((o,i)=>[o.b,{i, t:o.t}]));

const els = {
  q: document.getElementById('q'),
  hasUrl: document.getElementById('hasUrl'),
  scope: document.getElementById('scope'),
  book: document.getElementById('book'),
  rows: document.getElementById('rows'),
  stat: document.getElementById('stat'),
  clear: document.getElementById('clear'),
  err: document.getElementById('err'),
  buildTime: document.getElementById('buildTime'),
};

function shortUrl(u){
  if(!u) return '';
  try{
    const url = new URL(u);
    const p = url.pathname.split('/').filter(Boolean);
    return p.slice(-1)[0] || u;
  } catch(e){
    return u.length>42 ? (u.slice(0,42)+'…') : u;
  }
}

function tokenize(q){ return q.trim().toLowerCase().split(/\s+/).filter(Boolean); }

function normalizeTokens(rawTokens){
  const out = [];
  for(const t0 of rawTokens){
    const t = t0.replace(/[，。、]/g,'').trim();
    if(!t) continue;

    const m1 = t.match(/^第?(\d+)章?$/);
    if(m1){ out.push(m1[1]); continue; }

    const m2 = t.match(/^(.*?)(\d+)(章)?$/);
    if(m2 && m2[2]){
      const head=(m2[1]||'').replace(/^第/,'').replace(/第$/,'').trim();
      if(head) out.push(head);
      out.push(m2[2]);
      continue;
    }
    out.push(t);
  }
  return out;
}

function matchIntersect(d, tokens){
  if(!tokens.length) return true;
  const hay = [d.卷||'', String(d.章??''), d.url||'', shortUrl(d.url||'')].join(' ').toLowerCase();
  return tokens.every(t=>{
    if(/^\d+$/.test(t)) return String(d.章??'')===t; // 整章匹配（避免 1 命中 10/11）
    return hay.includes(t);
  });
}

function rebuildBookDropdown(){
  const scope = els.scope.value;
  const current = els.book.value;
  els.book.innerHTML = '';
  const optAll=document.createElement('option');
  optAll.value=''; optAll.textContent='全部書卷';
  els.book.appendChild(optAll);

  const books = ORDER.filter(o => scope==='all' || o.t===scope).map(o => o.b);
  for(const b of books){
    const opt=document.createElement('option');
    opt.value=b; opt.textContent=b;
    els.book.appendChild(opt);
  }

  if([...els.book.options].some(o=>o.value===current)) els.book.value=current;
  else els.book.value='';
}

function render(listAll){
  const tokens = normalizeTokens(tokenize(els.q.value));
  const book = els.book.value;
  const hasUrl = els.hasUrl.value;
  const scope = els.scope.value;

  let list = listAll.filter(d => matchIntersect(d, tokens));
  if(scope!=='all') list = list.filter(d => d.testament===scope);
  if(book) list = list.filter(d => d.卷===book);
  if(hasUrl==='yes') list = list.filter(d => d.hasUrl);
  if(hasUrl==='no') list = list.filter(d => !d.hasUrl);

  list.sort((a,b)=>(a.orderIndex-b.orderIndex)||((a.章??0)-(b.章??0)));

  const okCount = list.filter(d=>d.hasUrl).length;
  const todoCount = list.length - okCount;
  els.stat.textContent = `顯示 ${list.length} 筆（OK ${okCount} / TODO ${todoCount}）`;

  els.rows.innerHTML='';
  for(const d of list){
    const tr=document.createElement('tr');

    const tdB=document.createElement('td');
    tdB.setAttribute('data-label','卷');
    tdB.textContent=d.卷||'';
    tr.appendChild(tdB);

    const tdC=document.createElement('td');
    tdC.setAttribute('data-label','章');
    tdC.textContent=(d.章??'');
    tr.appendChild(tdC);

    const tdU=document.createElement('td');
    tdU.setAttribute('data-label','Artifacts（V1）');
    if(d.hasUrl){
      const a=document.createElement('a');
      a.href=d.url; a.target='_blank'; a.rel='noopener noreferrer';
      a.textContent=`📘 開啟 Artifacts（${shortUrl(d.url)}）`;
      tdU.appendChild(a);

      const div=document.createElement('div');
      div.className='muted';
      div.textContent=d.url;
      tdU.appendChild(div);
    } else {
      tdU.innerHTML='<span class="muted">（尚未建立）</span>';
    }
    tr.appendChild(tdU);

    const tdS=document.createElement('td');
    tdS.setAttribute('data-label','狀態');
    const badge=document.createElement('span');
    badge.className='badge '+(d.hasUrl?'ok':'todo');
    badge.textContent=d.hasUrl?'OK':'TODO';
    tdS.appendChild(badge);
    tr.appendChild(tdS);

    els.rows.appendChild(tr);
  }
}

function showErr(msg){
  els.err.style.display = msg ? 'block' : 'none';
  els.err.textContent = msg || '';
}

// ---- CSV parsing (supports quotes; also fixes CR-only line breaks) ----
function parseCSV(text){
  // 有些匯出會是 CR 當換行（\r）而不是 \n，這裡統一轉成 \n
  const normalized = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = normalized.split('\n').filter(l => l.trim().length>0);

  if(lines.length < 2) {
    throw new Error('CSV 似乎沒有換行（只有 1 行）。請確認上傳的是正常 CSV（每筆一行）。');
  }

  const rows = lines.map(parseCSVLine);
  const headers = rows[0].map(h => String(h||'').trim());

  const idxBook = headers.indexOf('卷');
  const idxChap = headers.indexOf('章');
  const idxUrl  = headers.indexOf('AI超連結_V1');

  if(idxBook===-1 || idxChap===-1 || idxUrl===-1){
    throw new Error('CSV 欄位需要包含：卷、章、AI超連結_V1（目前讀到的欄位：'+headers.join(', ')+')');
  }

  const out = [];
  for(let i=1;i<rows.length;i++) {
    const r = rows[i];
    const book = String(r[idxBook] ?? '').trim();
    const chapRaw = String(r[idxChap] ?? '').trim();
    const chap = chapRaw ? Number(chapRaw) : NaN;
    const url = String(r[idxUrl] ?? '').trim();

    if(!book && !chapRaw && !url) continue;

    out.push({
      卷: book,
      章: Number.isFinite(chap) ? chap : null,
      url,
      hasUrl: !!url,
      testament: (orderMap[book]?.t) || 'UNK',
      orderIndex: (orderMap[book]?.i) ?? 9999,
    });
  }
  return out;
}

function parseCSVLine(line){
  const out = [];
  let cur = '';
  let inQuotes = false;
  for(let i=0;i<line.length;i++) {
    const ch = line[i];
    if(inQuotes) {
      if(ch === '"') {
        if(i+1 < line.length && line[i+1] === '"') { cur += '"'; i++; }
        else inQuotes = false;
      } else {
        cur += ch;
      }
    } else {
      if(ch === ',') { out.push(cur); cur=''; }
      else if(ch === '"') { inQuotes = true; }
      else { cur += ch; }
    }
  }
  out.push(cur);
  return out;
}

async function load(){
  els.buildTime.textContent = new Date().toLocaleString('zh-TW', { hour12:false });
  showErr('');
  els.stat.textContent = '讀取資料中…';

  const res = await fetch(CSV_URL, { cache: 'no-store' });
  if(!res.ok) throw new Error('下載 CSV 失敗：HTTP '+res.status);

  const text = await res.text();
  const data = parseCSV(text);

  const total = data.length;
  const ok = data.filter(d=>d.hasUrl).length;
  const todo = total - ok;

  rebuildBookDropdown();

  const renderNow = () => render(data);
  els.q.addEventListener('input', renderNow);
  els.hasUrl.addEventListener('change', renderNow);
  els.scope.addEventListener('change', () => { rebuildBookDropdown(); renderNow(); });
  els.book.addEventListener('change', renderNow);
  els.clear.addEventListener('click', () => {
    els.q.value='';
    els.hasUrl.value='all';
    els.scope.value='all';
    rebuildBookDropdown();
    els.book.value='';
    renderNow();
  });

  renderNow();
  els.stat.textContent += ` · 總筆數 ${total}（OK ${ok} / TODO ${todo}）`;
}

load().catch(err => {
  console.error(err);
  showErr('⚠️ '+err.message+'（你可以先確認 CSV raw 連結可在瀏覽器直接下載，或檔案是否每筆一行）');
  els.stat.textContent = '讀取失敗';
});
</script>
</body>
</html>
